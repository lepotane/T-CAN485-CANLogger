; LILYGO T-CAN485 - Ultra detailed OBD-II / CAN data logger
; Vehicle: Mercedes W204 C180K 1.6 ML Kompressor (SIM271KE) + custom turbo (twincharger)
;
; Board: ESP32 (arduino-esp32 3.0.1), CAN transceiver on GPIO27(TX)/GPIO26(RX),
;        transceiver power enable on GPIO16, CAN speed-mode select on GPIO23.
;        SD card on SPI: SCLK=14 MISO=2 MOSI=15 CS=13.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.11.0
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

; FreeRTOS + TWAI + SD are all bundled with the arduino-esp32 core.
; The WS2812B status LED is driven by a tiny built-in bit-bang (no external lib).
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_LOOP_STACK_SIZE=8192
    -I${PROJECT_DIR}/lib/Mylibrary
    -Wall
lib_ldf_mode = deep